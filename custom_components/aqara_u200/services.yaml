add_visitor_password:
  name: Add visitor password
  description: >-
    Enrol a visitor PIN on the Aqara U200 over Bluetooth (offline-capable). The
    front keypad panel must be awake. The lock never stores or returns the PIN
    in plaintext afterwards.
  target:
    entity:
      integration: aqara_u200
      domain: lock
  fields:
    pin:
      name: PIN
      description: The visitor PIN — an even number of decimal digits (e.g. 6 or 8).
      required: true
      example: "730492"
      selector:
        text:
    group_id:
      name: Group
      description: Credential group id (advanced; leave at 1 unless you know otherwise).
      required: false
      default: 1
      selector:
        number:
          min: 0
          max: 255
          mode: box

delete_user:
  name: Delete credential
  description: >-
    Delete a credential (and its user) from the Aqara U200 over Bluetooth. The
    front keypad panel must be awake — the integration wakes it (or asks you)
    first and errors if it stays asleep. Removes the whole user entry; for a
    visitor password (its own user) that deletes exactly that PIN.
  target:
    entity:
      integration: aqara_u200
      domain: lock
  fields:
    user_id:
      name: User id
      description: >-
        The lock's user id, as reported by the credentials sensor / the Aqara
        cloud (a 32-bit number, e.g. 2147614727).
      required: true
      example: 2147614727
      selector:
        number:
          min: 0
          max: 4294967295
          mode: box

enrol_credential:
  name: Enrol fingerprint/NFC (experimental)
  description: >-
    EXPERIMENTAL, interactive. Start a fingerprint or NFC-card enrolment on the
    Aqara U200 over Bluetooth. The front keypad panel must be awake, and you must
    physically present the finger (several times) or tap the card at the sensor
    while it runs. The integration fires `aqara_u200_enrol_progress` events during
    the flow. Not yet verified end-to-end against a real lock.
  target:
    entity:
      integration: aqara_u200
      domain: lock
  fields:
    user_group_id:
      name: User group id
      description: >-
        The user (group) id the credential attaches to, 0-255. Use an existing
        user's group id from the credentials sensor.
      required: true
      example: 1
      selector:
        number:
          min: 0
          max: 255
          mode: box
    kind:
      name: Credential kind
      description: What to enrol (admin variants grant admin permission).
      required: false
      default: finger
      selector:
        select:
          options:
            - "finger"
            - "nfc"
            - "finger_admin"
            - "nfc_admin"
