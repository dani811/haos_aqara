blueprint:
  name: Aqara U200 — pulsar el teclado cuando se requiere presencia
  description: >
    Cuando el Aqara U200 necesita el teclado despierto (cambio de idioma OTA, o
    una operación de credenciales: alta/baja de contraseña), pulsa el
    pulsador/fingerbot montado sobre el teclado para despertarlo dentro de la
    ventana de presencia de la cerradura. Un solo pulso basta; para el OTA de
    idioma autoriza toda la transferencia (~10 min), no hace falta pulsar por
    bloque.

    La integración emite el evento `aqara_u200_keypad_press_required` cuando una
    operación necesita presencia (su carga útil lleva el motivo en `reason` y la
    ventana en `window_seconds`); esta automatización responde dando el pulso. El
    retardo inicial deja que el handshake llegue a la fase que espera la presencia
    antes de pulsar, para que caiga dentro de la ventana y no antes.
  domain: automation
  author: haos_aqara
  input:
    keypad_switch:
      name: Pulsador del teclado
      description: El switch (p. ej. un fingerbot Aqara sobre el teclado) que da el pulso.
      selector:
        entity:
          filter:
            domain: switch
    startup_delay:
      name: Retardo antes de pulsar
      description: >
        Segundos a esperar tras iniciarse el OTA, para que llegue a la fase de
        presencia antes del pulso. Súbelo si el pulso cae demasiado pronto.
      default: 5
      selector:
        number:
          min: 0
          max: 30
          step: 1
          unit_of_measurement: s
          mode: slider
    press_duration:
      name: Duración del pulso
      description: Cuánto mantener el pulsador activado.
      default: 1
      selector:
        number:
          min: 0.2
          max: 5
          step: 0.1
          unit_of_measurement: s
          mode: slider

mode: single
max_exceeded: silent

triggers:
  - trigger: event
    event_type: aqara_u200_keypad_press_required

actions:
  - delay:
      seconds: !input startup_delay
  - action: switch.turn_on
    target:
      entity_id: !input keypad_switch
  - delay:
      seconds: !input press_duration
  - action: switch.turn_off
    target:
      entity_id: !input keypad_switch
